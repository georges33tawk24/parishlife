<script type="application/ld+json">{"@context":"https://schema.org","@graph":[{"@type":"SoftwareApplication","name":"ParishLife","url":"https://parish-life.org/landing.html","applicationCategory":"BusinessApplication","operatingSystem":"Web","inLanguage":["en","ar"],"description":"ParishLife keeps people, sacraments, attendance and the collection in one place — bilingual Arabic/English, dual currency USD/LBP."},{"@type":"FAQPage","mainEntity":[{"@type":"Question","name":"Does it work without internet?","acceptedAnswer":{"@type":"Answer","text":"Not for office work yet. Records are saved on ParishLife’s server, so entering them needs a connection; if a save fails, the screen says so at once and shows what is really on record. The public pages (parishes, Mass times and events) stay readable on a phone without a connection."}},{"@type":"Question","name":"Can we keep our paper registers?","acceptedAnswer":{"@type":"Answer","text":"Yes. ParishLife prints A4 pages carrying the same register numbering, so the bound book stays the legal original while the system is what you search and report from."}},{"@type":"Question","name":"What happens when the exchange rate moves?","acceptedAnswer":{"@type":"Answer","text":"Past records do not change. Every amount is stored with the rate that produced it, so a receipt reprinted next year gives the same figure. A new rate applies only going forward, and the system warns you when the rate has gone stale instead of quietly using it."}},{"@type":"Question","name":"Who can see what?","acceptedAnswer":{"@type":"Answer","text":"Staff access follows their office role, while members use a personal portal. The priest sees pastoral notes and approves certificates. The secretary does not see finances, the treasurer does not see pastoral notes, and a ministry leader sees only their groups. A volunteer can sign in as a member without belonging to a group."}},{"@type":"Question","name":"Can parishioners see their own records?","acceptedAnswer":{"@type":"Answer","text":"Through the member portal a family updates its own address, phone and members, requests a certificate and sees its own giving statement. It reaches no one else's record, and every change is reviewed by the office before it lands."}},{"@type":"Question","name":"Where is the data kept, and can we export it?","acceptedAnswer":{"@type":"Answer","text":"In ParishLife’s database, hosted by Microsoft Azure in France, with each parish’s records kept apart. Lists and reports export to CSV (which opens in Excel) or PDF in either language, without asking and without a fee. The records belong to the parish."}}]}]}</script>
