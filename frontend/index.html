<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ParishLife · Sign in</title>
<!-- The sign-in page and the members portal behind it are private: kept out of search results (the public pages are public.html). -->
<meta name="robots" content="noindex">
<meta name="description" content="ParishLife — parish administration for Lebanon. Bilingual and dual-currency.">
<meta name="theme-color" content="#FFFFFF">
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="apple-touch-icon" href="/assets/images/icons/apple-touch-icon.png">
<link rel="manifest" href="/site.webmanifest">
<!-- Fonts served from this site (OFL licences beside them), not from Google: opening the page sends nothing to a third party. -->
<link rel="preload" href="/assets/fonts/inter-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/assets/fonts/portal-fonts.css">
<!-- The sign-in and home backdrop (.sn-wall) is the largest paint; found only after the styles load without this. -->
<link rel="preload" as="image" href="/assets/images/sanctuary/wall.webp" fetchpriority="high">
<!-- Easier reading (src/reading/EasyReading.jsx) and the language, applied before the first frame. -->
<script>(() => { const r = document.documentElement; try { const s = localStorage.getItem('pl-text'); if (s === '2' || s === '3') r.dataset.text = s; if (localStorage.getItem('pl-simple') === '1') r.dataset.simple = ''; const q = new URLSearchParams(location.search).get('lang'), l = q === 'ar' || q === 'en' ? q : localStorage.getItem('pl-lang') === 'ar' ? 'ar' : 'en'; r.lang = l; r.dir = l === 'ar' ? 'rtl' : 'ltr'; } catch {} })();</script>
<script type="module" src="/src/portal/main.jsx"></script>
</head>
<body class="app-body">
<a class="skip" href="#well">Skip to content</a>
<div id="root" style="display:contents"></div>
<noscript>
  <div style="padding:48px;max-width:60ch;margin:0 auto;font:400 16px/26px 'Inter',sans-serif">
    <h1 style="font:600 26px/34px 'Inter',sans-serif">ParishLife</h1>
    <p style="margin-top:12px;color:#233B32">The members portal needs JavaScript switched on to sign you in. The
    parishes' public pages are at <a href="public.html">public.html</a>.</p>
    <p lang="ar" dir="rtl" style="margin-top:12px;color:#233B32">تحتاج بوّابة المؤمنين إلى تفعيل JavaScript لتسجيل دخولك. صفحات
    الرعايا العامة على <a href="public.html">public.html</a>.</p>
  </div>
</noscript>
</body>
</html>
